<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setback</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Setback (Auction Pitch) card game for phones.">
<meta name="theme-color" content="#1f4d38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Setback">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232f6b4f'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23f5f0e4'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="setback.css?v=3">
</head>
<body>
<div id="app">

  <header class="top">
    <div class="scores">
      <div class="score-team">
        <span class="lbl">E+W</span>
        <span class="pts" id="ewScore">0</span>
        <span class="games" id="ewGames" title="Games won">0</span>
      </div>
      <div class="score-team">
        <span class="lbl">N+S</span>
        <span class="pts" id="nsScore">0</span>
        <span class="games" id="nsGames" title="Games won">0</span>
      </div>
    </div>
    <div class="contract" id="contract"></div>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">&#8801;</button>
  </header>

  <div class="status" id="status"></div>

  <main class="table" id="table">
    <div class="seat seat-n" id="seat1"></div>
    <div class="seat seat-w" id="seat0"></div>
    <div class="seat seat-e" id="seat2"></div>
    <div class="trick" id="trick">
      <div class="slot slot-n" id="slot1"></div>
      <div class="slot slot-w" id="slot0"></div>
      <div class="slot slot-e" id="slot2"></div>
      <div class="slot slot-s" id="slot3"></div>
    </div>
    <div class="seat seat-s" id="seat3"></div>
    <div class="bid-panel" id="bidPanel" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </main>

  <footer class="hand-area">
    <div class="prompt" id="prompt"></div>
    <div class="hand" id="hand"></div>
  </footer>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

</div>
<noscript><p style="padding:1em;color:#fff">This game needs JavaScript.</p></noscript>
<script type="module" src="app.js?v=3"></script>
</body>
</html>
